name: 'Regenerate README version graphic'

# Regenerates the README version-tracks graphic — docs/version-tracks.svg
# and its dark-mode twin — from live go.dev and quay.io data, and the
# usage example between the readme-usage markers, and commits any change
# as github-actions[bot]. The rendering is owned by scripts/version-tracks.sh
# (see CONTRIBUTING): this workflow only runs the renderer and commits its
# output. Triggered by the image build workflows after they publish new
# tags, and by scheduled_dispatch.yml for weekly convergence. Uses the
# builtin GITHUB_TOKEN (workflow_dispatch is an explicit exception to the
# GITHUB_TOKEN recursion guard), so no additional secret is required.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-tracks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: add checkout action...
        uses: actions/checkout@v7
        with:
          # Always the default-branch tip at run start: queued workflow_dispatch
          # runs otherwise check out the commit snapshotted at dispatch time, and
          # pushing on top of it is rejected as non-fast-forward once another
          # refresh has landed. Full history so the pre-push rebase works.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: regenerate version tracks and usage example...
        run: |
          set -euo pipefail
          # Bash clears errexit inside command substitutions unless this is set;
          # without it a failed curl/jq inside the renderer would yield a
          # partial graphic instead of failing the run.
          shopt -s inherit_errexit

          # Both variants come from the one renderer — the train geometry,
          # the version labels, and the palette live in
          # scripts/version-tracks.sh, never duplicated here.
          mkdir -p docs
          scripts/version-tracks.sh > docs/version-tracks.svg
          scripts/version-tracks.sh --dark > docs/version-tracks-dark.svg

          # Per-kind published latest: the shared selector's
          # --latest-by-kind mode (see CONTRIBUTING) — one row per
          # family per tag kind, the newest patch tag of that kind,
          # kind-filtered BEFORE the per-minor reduction (a family can
          # publish stable 1.27.2 next to 1.27.3-pre).
          scripts/shipped-set.sh --latest-by-kind > /tmp/latest-by-kind.tsv

          # Newest row of a variant family and tag kind ("plain"/"pre")
          # from the selector's --latest-by-kind output — empty when the
          # family has nothing published of that kind (awk prints nothing
          # and the pipeline needs `|| true` to keep set -e from aborting).
          latest_for() { # $1 = family, $2 = kind → "<version>\t<digest>\t<tag>\t<last_modified>" of the newest row
            awk -F'\t' -v f="$1" -v k="$2" '$4 == f && $8 == k {print $1"\t"$5"\t"$6"\t"$7}' /tmp/latest-by-kind.tsv \
              | sort -t$'\t' -k1,1V | tail -1 || true
          }

          # The usage example pins the newest standard Go version, so it
          # is regenerated by the same refresh that updates the graphic —
          # a hardcoded version would rot between releases.
          usage_ver="$(latest_for ubi9 plain | cut -f1)"
          if [ -n "$usage_ver" ]; then
            {
              echo '```dockerfile'
              echo '# pin an exact Go version'
              echo "FROM quay.io/konveyor/builder:ubi9-v${usage_ver}"
              echo '```'
              echo ''
              echo '```sh'
              echo 'podman pull quay.io/konveyor/builder:ubi9-latest'
              echo '```'
            } > /tmp/usage.md
          else
            echo "WARNING: no published ubi9 standard version; leaving the usage example unchanged"
            : > /tmp/usage.md
          fi
          # Replace the generated region between its markers. Both markers
          # must exist: a missing end marker would make awk drop everything
          # after the start marker, silently truncating README.md.
          for marker in 'readme-usage:start' 'readme-usage:end'; do
            grep -q "<!-- ${marker}" README.md \
              || { echo "ERROR: README.md is missing the <!-- ${marker} ... --> marker; refusing to rewrite"; exit 1; }
          done
          if [ -s /tmp/usage.md ]; then
            awk -v block="$(cat /tmp/usage.md)" '
              /<!-- readme-usage:start/ {print; print block; skip=1; next}
              /<!-- readme-usage:end/   {skip=0; print; next}
              !skip {print}
            ' README.md > README.md.new && mv README.md.new README.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md docs/version-tracks.svg docs/version-tracks-dark.svg; then
            echo "README version tracks already up to date."
          else
            git add README.md docs/version-tracks.svg docs/version-tracks-dark.svg
            git commit -s -m "Update README version tracks (generated)"
            # Pick up anything that landed between checkout and this push, so
            # back-to-back refreshes never race into a non-fast-forward reject;
            # retry once if something still lands inside the pull-to-push window.
            git pull --rebase
            git push || { git pull --rebase && git push; }
          fi
