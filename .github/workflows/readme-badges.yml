name: 'Update README version badges'

# Regenerates the README region between the readme-badges markers from the
# tags currently published on quay.io/konveyor/builder and the golang-fips
# release list, and commits any change as github-actions[bot]. Each FIPS
# variant gets two badges — the latest stable and the latest pre-release
# version actually published — next to source-level go-fips stable and
# pre-release badges. Triggered by the image build workflows
# after they publish new tags, and by scheduled_dispatch.yml for weekly
# convergence. Uses the builtin GITHUB_TOKEN (workflow_dispatch is an
# explicit exception to the GITHUB_TOKEN recursion guard), so no
# additional secret is required.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: add checkout action...
        uses: actions/checkout@v7
        with:
          # Always the default-branch tip at run start: queued workflow_dispatch
          # runs otherwise check out the commit snapshotted at dispatch time, and
          # pushing on top of it is rejected as non-fast-forward once another
          # refresh has landed. Full history so the pre-push rebase works.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: regenerate version badges...
        run: |
          set -euo pipefail
          # Bash clears errexit inside command substitutions unless this is set;
          # without it a failed curl/jq in published_tags would yield a partial
          # tag list instead of failing the run.
          shopt -s inherit_errexit

          # Per-kind published latest: the shared selector's
          # --latest-by-kind mode (see CONTRIBUTING) — one row per
          # family per tag kind, the newest patch tag of that kind,
          # kind-filtered BEFORE the per-minor reduction (a family can
          # publish stable 1.27.2 next to 1.27.3-pre).
          scripts/shipped-set.sh --latest-by-kind > /tmp/latest-by-kind.tsv

          # golang-fips source releases (same candidate filter as
          # image-build.yml's FIPS selection), so FIPS badges can say
          # whether their published version is built from a stable or a
          # pre-release go-fips tag — the two are indistinguishable in the
          # quay tag name alone.
          # golang-fips source releases and the pre-release classification of
          # published FIPS images — both owned by shared scripts (see
          # CONTRIBUTING): go-fips-releases.sh for the release list,
          # fips-classify.sh for the label-first classification with the
          # push-time fallback for pre-label images.
          scripts/go-fips-releases.sh > /tmp/fips-releases.json
          
                    # Latest go-fips release version with the given pre-release
                    # status ("true"/"false") — for the source-level stable and
                    # pre-release badges.
                    fips_latest() {
                      jq -rn --argjson pre "$1" --slurpfile r /tmp/fips-releases.json '
                        [$r[0][] | select(.pre == $pre) | (.tag | split("-")[0] | ltrimstr("go"))]
                        | sort_by(split(".") | map(tonumber)) | last // empty'
                    }

          # Latest published Go version per image variant. Empty when the variant
          # Newest row of a variant family and tag kind ("plain"/"pre")
          # from the selector's --latest-by-kind output — empty when the
          # family has nothing published of that kind (awk prints nothing
          # and the pipeline needs `|| true` to keep set -e from aborting).
          latest_for() { # $1 = family, $2 = kind → "<version>\t<digest>\t<tag>\t<last_modified>" of the newest row
            awk -F'\t' -v f="$1" -v k="$2" '$4 == f && $8 == k {print $1"\t"$5"\t"$6"\t"$7}' /tmp/latest-by-kind.tsv \
              | sort -t$'\t' -k1,1V | tail -1 || true
          }

          badge() {
            # $1 = label, $2 = family, $3 = color
            local line ver
            line="$(latest_for "$2" plain)"
            ver="$(cut -f1 <<< "$line")"
            if [ -n "$ver" ]; then
              echo "[![${1}](https://img.shields.io/badge/${1// /_}-Go_${ver}-${3})](https://quay.io/repository/konveyor/builder?tab=tags)"
            fi
          }

          # FIPS variant badge: same as badge(), but honest about the
          # go-fips source of the published version (shields escapes a
          # literal dash as "--"). $3 selects the row kind: "plain"
          # renders the stable line — a plain tag built from a
          # pre-release source keeps the orange "pre-release" version
          # marker, honesty over labeling; "pre" renders the pre-release
          # line from -pre tags, where the label already says it
          fips_badge() {
            # $1 = label, $2 = family, $3 = kind
            local line ver digest ts suffix color slug
            line="$(latest_for "$2" "$3")"
            IFS=$'\t' read -r ver digest _ ts <<< "$line"
            if [ -n "$ver" ]; then
              if [ "$3" = "pre" ]; then
                suffix=""; color=orange
              else
                # plain tags: classify by the recorded source (label) or,
                # for pre-label images, by push timing. A version with no
                # matching golang-fips release (upstream deleted it) gets a
                # grey "unknown" badge rather than aborting the refresh —
                # one stale row must not freeze every variant's badges —
                # but it is never silently labeled stable
                case "$(scripts/fips-classify.sh /tmp/fips-releases.json "$ver" "$ts" "$digest")" in
                  true)    suffix="_pre--release"; color=orange ;;
                  false)   suffix=""; color=blueviolet ;;
                  unknown) suffix="_unknown"; color=lightgrey ;;
                  *)
                    echo "ERROR: unexpected classification for published FIPS version ${ver}"
                    exit 1
                    ;;
                esac
              fi
              # the label slug escapes both spaces and dashes
              slug="${1// /_}"; slug="${slug//-/--}"
              echo "[![${1}](https://img.shields.io/badge/${slug}-Go_${ver}${suffix}-${color})](https://quay.io/repository/konveyor/builder?tab=tags)"
            fi
          }

          {
            # Source-level go-fips badges: the latest stable and the
            # latest pre-release golang-fips release, so readers can tell
            # whether a claimed FIPS version is stable or pre-release.
            gofips_stable="$(fips_latest false)"
            gofips_pre="$(fips_latest true)"
            if [ -n "$gofips_stable" ]; then
              echo "[![go-fips stable](https://img.shields.io/badge/go--fips_stable-Go_${gofips_stable}-blueviolet)](https://github.com/golang-fips/go/releases)"
            fi
            if [ -n "$gofips_pre" ]; then
              echo "[![go-fips pre-release](https://img.shields.io/badge/go--fips_pre--release-Go_${gofips_pre}-orange)](https://github.com/golang-fips/go/releases)"
            fi

            # Badge entries are derived from the variant registry
            # (variants.txt), so new variants are covered automatically.
            # ubi8 publishes unprefixed tags; ubi9/ubi10 are prefixed.
            # FIPS variants get two lines — the latest stable and the
            # latest pre-release actually published — mirroring the
            # source-level go-fips badge pair above; either line is
            # omitted when that kind has no published image
            while read -r major flavor; do
              if [ "$flavor" = "fips" ]; then
                fips_badge "UBI ${major} FIPS stable" "ubi${major}-fips" plain
                fips_badge "UBI ${major} FIPS pre-release" "ubi${major}-fips" pre
              else
                badge "UBI ${major}" "ubi${major}" blue
              fi
            done < <(grep -vE '^[[:space:]]*(#|$)' variants.txt | sort -n)
          } > /tmp/badges.md

          # Replace the generated region between the markers. Both markers must
          # exist: a missing end marker would make awk drop everything after
          # the start marker, silently truncating README.md.
          for marker in 'readme-badges:start' 'readme-badges:end'; do
            grep -q "<!-- ${marker}" README.md \
              || { echo "ERROR: README.md is missing the <!-- ${marker} ... --> marker; refusing to rewrite"; exit 1; }
          done

          # Replace the generated region between the markers.
          awk -v block="$(cat /tmp/badges.md)" '
            /<!-- readme-badges:start/ {print; print block; skip=1; next}
            /<!-- readme-badges:end/   {skip=0; print; next}
            !skip {print}
          ' README.md > README.md.new && mv README.md.new README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README version badges already up to date."
          else
            git add README.md
            git commit -s -m "Update README version badges (generated)"
            # Pick up anything that landed between checkout and this push, so
            # back-to-back refreshes never race into a non-fast-forward reject;
            # retry once if something still lands inside the pull-to-push window.
            git pull --rebase
            git push || { git pull --rebase && git push; }
          fi
