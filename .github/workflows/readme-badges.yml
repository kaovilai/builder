name: 'Update README version badges'

# Regenerates the README region between the readme-badges markers from the
# tags currently published on quay.io/konveyor/builder and the golang-fips
# release list, and commits any change as github-actions[bot]. FIPS badges
# carry a "pre-release" marker (orange) when their published version is
# built from a pre-release golang-fips tag, next to source-level go-fips
# stable and pre-release badges. Triggered by the image build workflows
# after they publish new tags, and by scheduled_dispatch.yml for weekly
# convergence. Uses the builtin GITHUB_TOKEN (workflow_dispatch is an
# explicit exception to the GITHUB_TOKEN recursion guard), so no
# additional secret is required.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: add checkout action...
        uses: actions/checkout@v7
        with:
          # Always the default-branch tip at run start: queued workflow_dispatch
          # runs otherwise check out the commit snapshotted at dispatch time, and
          # pushing on top of it is rejected as non-fast-forward once another
          # refresh has landed. Full history so the pre-push rebase works.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: regenerate version badges...
        run: |
          set -euo pipefail
          # Bash clears errexit inside command substitutions unless this is set;
          # without it a failed curl/jq in published_tags would yield a partial
          # tag list instead of failing the run.
          shopt -s inherit_errexit

          # Collect all active tags published to quay.io/konveyor/builder.
          published_tags() {
            local page=1 resp
            while :; do
              resp=$(curl -sfS --retry 3 --retry-delay 5 --max-time 30 \
                "https://quay.io/api/v1/repository/konveyor/builder/tag/?limit=100&page=${page}&onlyActiveTags=true")
              echo "$resp" | jq -r '.tags[] | "\(.name) \(.last_modified)"' 
              [ "$(echo "$resp" | jq -r '.has_additional')" = "true" ] || break
              page=$((page + 1))
            done
          }
          PUBLISHED_TAGS="$(published_tags)"

          # golang-fips source releases (same candidate filter as
          # image-build.yml's FIPS selection), so FIPS badges can say
          # whether their published version is built from a stable or a
          # pre-release go-fips tag — the two are indistinguishable in the
          # quay tag name alone.
          FIPS_RELEASES="$(gh api repos/golang-fips/go/releases --paginate | jq -s 'add')"

          # Pre-release status of the go-fips source behind an image tag:
          # builds always use the best release of the version current at
          # build time, so the image is pre-release iff no stable release
          # of that Go version had been published when the tag was last
          # pushed. "false" when no matching release exists at all (no
          # evidence of a pre-release source).
          fips_pre() { # $1 = Go version, $2 = tag last_modified (RFC 1123)
            local ts_iso
            ts_iso="$(date -u -d "$2" +%Y-%m-%dT%H:%M:%SZ)"
            jq -r --arg v "$1" --arg ts "$ts_iso" '
              [ .[] | select(.draft == false)
                | select(.tag_name | test("^go[0-9]+\\.[0-9]+(\\.[0-9]+)?-[0-9]+-(openssl-fips|hostfips-release)$"))
                | select(.tag_name | startswith("go" + $v + "-"))
                | {tag: .tag_name, pre: .prerelease, at: .published_at} ]
              | if length == 0 then false
                else ([ .[] | select(.pre == false) | select(.at <= $ts) ] | length) == 0
                end
            ' <<< "$FIPS_RELEASES"
          }

          # Latest go-fips release version with the given pre-release
          # status ("true"/"false") — for the source-level stable and
          # pre-release badges.
          fips_latest() {
            jq -r --argjson pre "$1" '
              [ .[] | select(.draft == false)
                | select(.tag_name | test("^go[0-9]+\\.[0-9]+(\\.[0-9]+)?-[0-9]+-(openssl-fips|hostfips-release)$"))
                | select(.prerelease == $pre)
                | (.tag_name | split("-")[0] | ltrimstr("go")) ]
              | sort_by(split(".") | map(tonumber)) | last // empty
            ' <<< "$FIPS_RELEASES"
          }

          # Latest published Go version per image variant. Empty when the variant
          # has no matching tag yet — grep exits 1 on no match, so the pipeline
          # needs `|| true` to keep set -e/pipefail from aborting the run.
          latest_for() { # $1 = published-tag regex → "<version> <last_modified>" of the newest match
            grep -E "$1" <<< "$PUBLISHED_TAGS" \
              | sed -E 's/^.*v([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]+(.*)$/\1 \2/' | sort -V | tail -1 || true
          }

          badge() {
            # $1 = label, $2 = published-tag regex, $3 = color
            local line ver
            line="$(latest_for "$2")"
            ver="${line%% *}"
            if [ -n "$ver" ]; then
              echo "[![${1}](https://img.shields.io/badge/${1// /_}-Go_${ver}-${3})](https://quay.io/repository/konveyor/builder?tab=tags)"
            fi
          }

          # FIPS variant badge: same as badge(), but orange with a
          # "pre-release" suffix when the published version's go-fips
          # source is a pre-release tag (shields escapes a literal dash
          # as "--")
          fips_badge() {
            # $1 = label, $2 = published-tag regex
            local line ver ts suffix color
            line="$(latest_for "$2")"
            ver="${line%% *}"
            ts="${line#* }"
            if [ -n "$ver" ]; then
              case "$(fips_pre "$ver" "$ts")" in
                true)    suffix="_pre--release"; color=orange ;;
                false)   suffix=""; color=blueviolet ;;
                *)
                  echo "ERROR: no golang-fips release matches published FIPS version ${ver}; refusing to mark it stable"
                  exit 1
                  ;;
              esac
              echo "[![${1}](https://img.shields.io/badge/${1// /_}-Go_${ver}${suffix}-${color})](https://quay.io/repository/konveyor/builder?tab=tags)"
            fi
          }

          {
            # Source-level go-fips badges: the latest stable and the
            # latest pre-release golang-fips release, so readers can tell
            # whether a claimed FIPS version is stable or pre-release.
            gofips_stable="$(fips_latest false)"
            gofips_pre="$(fips_latest true)"
            if [ -n "$gofips_stable" ]; then
              echo "[![go-fips stable](https://img.shields.io/badge/go--fips_stable-Go_${gofips_stable}-blueviolet)](https://github.com/golang-fips/go/releases)"
            fi
            if [ -n "$gofips_pre" ]; then
              echo "[![go-fips pre-release](https://img.shields.io/badge/go--fips_pre--release-Go_${gofips_pre}-orange)](https://github.com/golang-fips/go/releases)"
            fi

            # Badge entries are derived from the variant registry
            # (variants.txt), so new variants are covered automatically.
            # ubi8 publishes unprefixed tags; ubi9/ubi10 are prefixed.
            while read -r major flavor; do
              if [ "$flavor" = "fips" ]; then
                if [ "$major" = "8" ]; then rx='^openssl-fips-v'; else rx="^ubi${major}-openssl-fips-v"; fi
                fips_badge "UBI ${major} FIPS" "${rx}[0-9]+\.[0-9]+\.[0-9]+[[:space:]]"
              else
                if [ "$major" = "8" ]; then rx='^v'; else rx="^ubi${major}-v"; fi
                badge "UBI ${major}" "${rx}[0-9]+\.[0-9]+\.[0-9]+[[:space:]]" blue
              fi
            done < <(grep -vE '^[[:space:]]*(#|$)' variants.txt | sort -n)
          } > /tmp/badges.md

          # Replace the generated region between the markers. Both markers must
          # exist: a missing end marker would make awk drop everything after
          # the start marker, silently truncating README.md.
          for marker in 'readme-badges:start' 'readme-badges:end'; do
            grep -q "<!-- ${marker}" README.md \
              || { echo "ERROR: README.md is missing the <!-- ${marker} ... --> marker; refusing to rewrite"; exit 1; }
          done

          # Replace the generated region between the markers.
          awk -v block="$(cat /tmp/badges.md)" '
            /<!-- readme-badges:start/ {print; print block; skip=1; next}
            /<!-- readme-badges:end/   {skip=0; print; next}
            !skip {print}
          ' README.md > README.md.new && mv README.md.new README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "README version badges already up to date."
          else
            git add README.md
            git commit -s -m "Update README version badges (generated)"
            # Pick up anything that landed between checkout and this push, so
            # back-to-back refreshes never race into a non-fast-forward reject;
            # retry once if something still lands inside the pull-to-push window.
            git pull --rebase
            git push || { git pull --rebase && git push; }
          fi
