name: 'Workflow lint'

# Lints .github/workflows with actionlint — catches invalid workflow files
# (syntax, unavailable contexts like matrix in a job-level if, schema
# violations) before they cost a CI cycle.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      # the actionlint image pin and its lookup feed this job
      - 'docker-compose.yml'
      - 'scripts/tool-pins.sh'
  push:
    paths:
      - '.github/workflows/**'
      - 'docker-compose.yml'
      - 'scripts/tool-pins.sh'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: add checkout action...
        uses: actions/checkout@v7

      - name: run actionlint...
        # The ignored shellcheck codes are deliberate repo patterns: ls | sort
        # pipelines in the variant enumerations, and
        # unquoted $(ls /tmp/digests) word-splitting when passing digest lists.
        run: |
          # image pin owned by docker-compose.yml, bumped by Dependabot
          # (single owner of the lookup: scripts/tool-pins.sh)
          docker run --rm -v "$PWD:/repo" -w /repo "$(scripts/tool-pins.sh actionlint)" -color \
            -ignore 'shellcheck reported issue in this script: SC(2010|2012|2046|2086)'
