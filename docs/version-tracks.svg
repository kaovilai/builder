<title id="tt">Go version tracks</title>
<desc id="td">Latest stable Go version per source — go.dev upstream, the UBI go-fips images, and the standard UBI images — as trains on three tracks over a shared version axis; older releases trail behind each engine.</desc>

<style>
  .spin { transform-box: fill-box; transform-origin: center;
          animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bob  { animation: bob 1.1s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(1.5px); } }
  .puff { animation: puff 2.4s ease-out infinite; }
  @keyframes puff {
    0%   { opacity: 0;   transform: translate(0,0) scale(.4); }
    25%  { opacity: .45; }
    100% { opacity: 0;   transform: translate(14px,-30px) scale(1.5); }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin, .bob, .puff { animation: none; }
  }
</style>

